name: Release

# 打 tag（v*）自动构建 Universal DMG 并挂到对应 Release。
# 发布产物在 GitHub runner 上构建有两个目的：
# 1. 二进制里不携带任何本机路径（SPM Bundle.module 会把构建目录的绝对路径
#    编译进 fallback 字符串——本机构建会泄漏 /Users/<name>/）
# 2. 产物可复现：任何人可对照 CI 日志验证 DMG 来源
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Run tests
        run: swift test

      # Developer ID 证书导入临时 keychain（p12 base64 存 secret）。
      # set-key-partition-list 免掉 codesign 取私钥时的交互授权——CI 无人点弹窗。
      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN=/tmp/ci.keychain-db
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$DEVELOPER_ID_P12" | base64 -d > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f /tmp/cert.p12
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      # 签名 + 公证 + DMG。公证走 App Store Connect API key(可撤销,不含 Apple ID 密码)。
      - name: Build, sign & notarize universal DMG
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          printf '%s' "$NOTARY_KEY_P8" > /tmp/notary.p8
          NOTARY_KEY_FILE=/tmp/notary.p8 ./scripts/build-release.sh --sign --dmg
          rm -f /tmp/notary.p8

      # 公证/staple 真实生效的硬校验——比"公证提交成功"更强:直接问 Gatekeeper
      - name: Verify Gatekeeper acceptance
        run: |
          spctl -a -t exec -vv dist/MindBus.app
          xcrun stapler validate dist/MindBus.app

      # 二进制里不该有任何构建机绝对路径——那都是「只在打包机上能跑」的隐患（issue #3 正是
      # 靠旧白名单里的 /Users/runner/ 路径蒙混过关的）。唯一放行：SwiftPM 生成的 Bundle.module
      # 兜底串，它已不参与解析（AppResources 只认 .app 内部，build-release.sh 的
      # --check-resources 自检保证），留在二进制里是死字符串。/Users/dev/ 是样本数据的虚构前缀。
      - name: Verify no build-machine paths in binaries
        run: |
          for bin in dist/MindBus.app/Contents/MacOS/MindBus dist/MindBus.app/Contents/MacOS/mindbus-mcp; do
            if strings "$bin" | grep -E "^/(Users|private|tmp|opt)/" \
                | grep -vE "^/Users/runner/work/mindbus/mindbus/\.build/[^/]+/release/MindBus_MindBus\.bundle$" \
                | grep -v "^/Users/dev/"; then
              echo "::error::$bin contains build-machine paths"; exit 1
            fi
          done
          echo "binary path check passed"

      # Sparkle 更新包：zip + EdDSA 签名 + 单条目 appcast（永远只描述最新版）
      - name: Package & sign Sparkle update
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)"
          ZIP="dist/MindBus-${VERSION}.zip"
          ditto -c -k --keepParent dist/MindBus.app "$ZIP"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > /tmp/ed.key
          SIG_ATTRS="$(./.build/artifacts/sparkle/Sparkle/bin/sign_update -f /tmp/ed.key "$ZIP" | tr -d '\n')"
          rm -f /tmp/ed.key
          ./scripts/make-appcast.sh "$VERSION" "$BUILD" "$ZIP" "$SIG_ATTRS" > /tmp/appcast.xml
          echo "appcast entry: $SIG_ATTRS"

      - name: Upload DMG + zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "MindBus ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/MindBus-*.dmg dist/MindBus-*.zip --clobber

      # appcast 提交回 main（SUFeedURL 指向 main 分支的 raw 路径）。
      # tag checkout 是 detached HEAD，切到 main 再放文件，避免把 tag 历史推上去。
      - name: Publish appcast to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          git diff --cached --quiet || { git commit -m "appcast: ${GITHUB_REF_NAME}"; git push origin main; }
